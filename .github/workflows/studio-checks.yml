name: Studio template checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.md'
      - '*.csv'
      - 'docs/**'
      - 'scripts/check-template.sh'
      - '.github/workflows/studio-checks.yml'
permissions:
  contents: read
concurrency:
  group: studio-template-${{ github.ref }}
  cancel-in-progress: true
jobs:
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check template documents
        run: bash scripts/check-template.sh
