name: Publish Pardex Control Panel
on:
  push:
    branches: [main]
    paths:
      - 'control-panel/**'
      - '.github/workflows/pages-control-panel.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pardex-control-panel-pages
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate static panel
        run: |
          test -s control-panel/index.html
          grep -q 'id="make-task"' control-panel/index.html
          grep -q 'id="make-brief"' control-panel/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only static panel
        uses: actions/upload-pages-artifact@v4
        with:
          path: control-panel
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
